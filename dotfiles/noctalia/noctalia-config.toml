[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.0
capsule = true
capsule_radius = 6
capsule_thickness = 0.99999998137354851
center = [ "media", "taskbar", "clock" ]
end = [ "privacy", "tray", "group:g1", "notifications", "network", "volume", "battery", "control-center" ]
margin_edge = 6
margin_ends = 8
padding = 0
panel_overlap = 2
radius = 6
shadow = false
start = [ "workspaces", "active_window" ]
thickness = 31

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 6.0
    radius = 6.0

