# Piri Configuration File

[niri]

[piri.plugins]
scratchpads = true
empty = false
window_rule = false
singleton = false
window_order = false
swallow = false
workspace_rule = false
mark = false
sticky = false

[piri.scratchpad]
default_size = "40% 60%"
default_margin = 20

# Kitty – slides in from the LEFT
[scratchpads.kitty]
direction = "fromLeft"
command = "kitty -d ~ --class=piri.kitty -o remember_window_size=no"
app_id = "piri.kitty"
size = "40% 60%"
margin = 20
peek_pixels = 15
peek_offset = 3

